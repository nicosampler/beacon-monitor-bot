version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: beacon-monitor-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - beacon_postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # migrate:
