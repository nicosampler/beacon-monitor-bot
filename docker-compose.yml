services:
  postgres:
    image: postgres:16
    container_name: db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - beacon_postgres_data:/var/lib/postgresql/data
    shm_size: 1g
    command:
     command:
      - -c
      - shared_buffers=2GB            
      - -c
      - effective_cache_size=12GB     
      - -c
      - work_mem=128MB                
      - -c
      - maintenance_work_mem=512MB    
      - -c
      - max_wal_size=10GB             
      - -c
      - min_wal_size=2GB              
      - -c
      - checkpoint_timeout=10min      
      - -c
      - checkpoint_completion_target=0.9  
      - -c
      - wal_compression=on            
      - -c
      - random_page_cost=1.1   
    networks:
      - app-network
    logging:
      options:
        max-size: "10m"
        max-file: "2"

  migrate:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
    command: >
      sh -c "npx prisma db push"
    networks:
      - app-network

  fetch:
    container_name: fetch
    restart: on-failure
    env_file:
      - .env
    build:
      context: .
      dockerfile: packages/fetch/Dockerfile
    depends_on:
      - migrate
    networks:
      - app-network

  bot:
    container_name: bot
    restart: on-failure
    env_file:
      - .env
    build:
      context: .
      dockerfile: packages/bot/Dockerfile
    depends_on:
      - fetch
    networks:
      - app-network
    logging:
      options:
        max-size: "25m"
        max-file: "2"

  api:
    container_name: api
    restart: on-failure
    env_file:
      - .env
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "3005:3005"
    depends_on:
      - migrate
    networks:
      - app-network
    logging:
      options:
        max-size: "25m"
        max-file: "2"

