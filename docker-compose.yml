version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - beacon_postgres_data:/var/lib/postgresql/data
    shm_size: 1g
    command:
      - -c
      - checkpoint_timeout=4min
      - -c
      - checkpoint_completion_target=0.95
      - -c
      - max_wal_size=5GB
      - -c
      - shared_buffers=1GB
    networks:
      - app-network
    logging:
      options:
        max-size: "10m"
        max-file: "2"

  migrate:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
    command: >
      sh -c "npx prisma db push"
    networks:
      - app-network

  beacon-fetch:
    container_name: fetch
    restart: on-failure
    env_file:
      - .env
    build:
      context: .
      dockerfile: packages/beacon-fetch/Dockerfile
    depends_on:
      - migrate
    networks:
      - app-network

  bot:
    container_name: bot
    restart: on-failure
    env_file:
      - .env
    build:
      context: .
      dockerfile: packages/telegram-bot/Dockerfile
    depends_on:
      - beacon-fetch
    networks:
      - app-network
    logging:
      options:
        max-size: "25m"
        max-file: "2"

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app-network

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter
    container_name: postgres-exporter
    env_file:
      - .env
    environment:
      - DATA_SOURCE_NAME=${DATA_SOURCE_NAME}
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  beacon_postgres_data:
  grafana_data: