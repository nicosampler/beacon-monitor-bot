  #     - postgres
  #   command: >
  #     sh -c "
  #     npx prisma db push"
  #   networks:
  #     - app-network

  beacon-fetch:
    container_name: beacon-monitor-fetch
    env_file:
      - .env
    build:
      context: .
      dockerfile: packages/beacon-fetch/Dockerfile
    # depends_on:
    #   - migrate
    networks:
      - app-network

